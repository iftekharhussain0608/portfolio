<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LinkedIn banner source</title>
<!-- Render with: tools/build-og.sh  (also produces assets/linkedin-banner.png at 1584x396).
     LinkedIn's profile photo covers the lower-left of the banner, so all content sits right of ~470px. -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1584px; height: 396px; overflow: hidden; }
  body { background: #07080C; color: #F4F4F6; font-family: Geist, Inter, system-ui, sans-serif; position: relative; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); }
  .b1 { width: 520px; height: 520px; left: 300px; top: -320px; background: #3B5BDB; opacity: .55; }
  .b2 { width: 560px; height: 560px; right: -100px; top: -260px; background: #7C3AED; opacity: .55; }
  .b3 { width: 400px; height: 400px; left: 860px; bottom: -320px; background: #DB2777; opacity: .35; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 44px 44px; -webkit-mask-image: radial-gradient(ellipse 60% 90% at 60% 30%, #000 20%, transparent 80%); }
  .copy { position: absolute; left: 490px; top: 74px; }
  .pill { display: inline-flex; align-items: center; gap: 10px; padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.05); font: 500 15px "Geist Mono", monospace; letter-spacing: .05em; text-transform: uppercase; color: #A1A1AA; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: linear-gradient(92deg, #6EA8FE, #A78BFA); box-shadow: 0 0 10px #A78BFA; }
  h1 { margin: 24px 0 0; font-size: 58px; line-height: 1.05; font-weight: 650; letter-spacing: -0.045em; max-width: 17ch; }
  .grad { background: linear-gradient(92deg, #6EA8FE, #A78BFA 50%, #F0ABFC); -webkit-background-clip: text; color: transparent; }
  .chips { position: absolute; right: 80px; top: 50%; transform: translateY(-50%); display: grid; gap: 12px; justify-items: end; }
  .chip { padding: 10px 18px; border-radius: 999px; font-size: 18px; font-weight: 500; background: rgba(16,18,28,.8); border: 1px solid rgba(255,255,255,.16); box-shadow: 0 12px 30px -12px rgba(0,0,0,.8); }
  .chip:nth-child(2) { margin-right: 40px; } .chip:nth-child(3) { margin-right: 10px; }
  .chip b { background: linear-gradient(92deg, #6EA8FE, #A78BFA 50%, #F0ABFC); -webkit-background-clip: text; color: transparent; font-weight: 650; }
</style>
</head>
<body>
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><div class="grid"></div>
  <div class="copy">
    <span class="pill"><i></i>Salesforce Architect · Customer Success</span>
    <h1>Architecting platforms that deliver <span class="grad">real business value.</span></h1>
  </div>
  <div class="chips">
    <span class="chip"><b>8×</b> certified · Salesforce + Claude</span>
    <span class="chip">✦ Agentforce Specialist</span>
    <span class="chip"><b>3×</b> Architect certified</span>
  </div>
</body>
</html>
